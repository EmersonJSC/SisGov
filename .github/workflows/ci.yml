name: Verificações

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Formatação, lint, build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar verificações
        run: npm run check
