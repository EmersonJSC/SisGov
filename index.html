<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SisGov — Simulação política, social e econômica</title>
    <style>
      :root {
        --institution-bar-height: 72px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #182230;
        background: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 320px;
      }
      button,
      input {
        font: inherit;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #e7ebef;
      }
      h1 {
        margin: 0;
        font-size: 1.05rem;
      }
      header p {
        margin: 0.2rem 0 0;
        color: #6a7480;
        font-size: 0.78rem;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      .turn {
        padding: 0.45rem 0.7rem;
        border-radius: 999px;
        background: #f0f3f6;
        font-size: 0.8rem;
        font-weight: 750;
      }
      button,
      .link-button {
        min-height: 2.5rem;
        padding: 0.58rem 0.85rem;
        border: 0;
        border-radius: 0.55rem;
        background: #16283b;
        color: white;
        cursor: pointer;
        font-weight: 750;
        text-decoration: none;
      }
      button:hover,
      .link-button:hover {
        background: #29435e;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .secondary {
        border: 1px solid #c7d0d9;
        background: white;
        color: #344455;
      }
      main {
        min-height: calc(100vh - 76px);
      }
      .map-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.8rem 1.5rem;
        border-bottom: 1px solid #edf0f3;
      }
      .map-toolbar p {
        margin: 0;
        color: #687583;
        font-size: 0.78rem;
      }
      .map-actions {
        display: flex;
        align-items: center;
        gap: 0.55rem;
      }
      #pending {
        color: #9a5c0b;
        font-size: 0.78rem;
        font-weight: 750;
      }
      .law-stage {
        position: relative;
        min-height: max(700px, calc(100vh - 146px));
        min-width: 1050px;
        overflow: hidden;
        background: #fff;
      }
      .category-zone {
        position: absolute;
        z-index: 1;
        width: 39%;
        height: 29%;
        translate: -50% -50%;
        border: 1px solid var(--category-border);
        border-radius: 50%;
        background: color-mix(in srgb, var(--category-bg) 78%, transparent);
        transition:
          left 620ms ease,
          top 620ms ease,
          width 620ms ease,
          height 620ms ease;
      }
      .macro-area-region {
        position: absolute;
        z-index: 0;
        translate: -50% -50%;
        border: 2px solid
          color-mix(in srgb, var(--macro-color) 35%, transparent);
        border-radius: 46% 54% 51% 49% / 55% 45% 55% 45%;
        background: color-mix(in srgb, var(--macro-color) 10%, transparent);
        box-shadow: inset 0 0 4rem
          color-mix(in srgb, var(--macro-color) 7%, transparent);
        pointer-events: none;
        transition:
          left 620ms ease,
          top 620ms ease,
          width 620ms ease,
          height 620ms ease;
      }
      .macro-area-region > span {
        position: absolute;
        left: 50%;
        top: 1.1rem;
        translate: -50% 0;
        width: 80%;
        color: color-mix(in srgb, var(--macro-color) 80%, #263441);
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-align: center;
        text-transform: uppercase;
      }
      .ministry-zone {
        border-width: 2px;
        background: color-mix(in srgb, var(--category-bg) 63%, transparent);
        box-shadow: 0 0 3rem
          color-mix(in srgb, var(--category-color) 8%, transparent);
      }
      main {
        overflow-x: auto;
      }
      .category-zone span {
        position: absolute;
        top: 10%;
        width: 85%;
        text-align: center;
        left: 50%;
        translate: -50% 0;
        color: var(--category-color);
        font-size: 0.72rem;
        font-weight: 850;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .law-lines {
        position: absolute;
        inset: 0;
        z-index: 3;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .law-lines path.relation,
      .law-lines path.condition {
        fill: none;
        stroke: #8da3b7;
        stroke-linecap: round;
        stroke-width: var(--flow-width, 0.28);
        opacity: 0;
        transition: opacity 160ms ease;
      }
      .law-lines path.visible {
        opacity: 1;
      }
      .law-lines path.rise {
        stroke: #25865a;
        stroke-dasharray: 1.2 0.85;
        animation: relation-flow var(--flow-duration, 1.5s) linear infinite;
      }
      .law-lines path.fall {
        stroke: #be4f4f;
        stroke-dasharray: 1.2 0.85;
        animation: relation-flow var(--flow-duration, 1.5s) linear infinite;
      }
      .law-lines path.condition {
        stroke-dasharray: 1.2 0.8;
      }
      @keyframes relation-flow {
        to {
          stroke-dashoffset: -4;
        }
      }
      .relation-feedback {
        position: absolute;
        z-index: 4;
        right: 1.5rem;
        bottom: 1.5rem;
        display: grid;
        gap: 0.3rem;
        max-width: 20rem;
        padding: 0.7rem 0.8rem;
        border: 1px solid #dce4ea;
        border-radius: 0.7rem;
        background: rgb(255 255 255 / 92%);
        box-shadow: 0 0.6rem 1.8rem rgb(24 40 58 / 12%);
        color: #465463;
        font-size: 0.7rem;
        font-weight: 700;
        line-height: 1.35;
        pointer-events: none;
      }
      .map-node {
        position: absolute;
        z-index: 4;
        display: grid;
        place-content: center;
        justify-items: center;
        width: var(--size);
        height: var(--size);
        padding: 0.75rem;
        border: 1px solid #9aa9b7;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0.45rem 1.4rem rgb(24 40 58 / 12%);
        color: #1f3143;
        text-align: center;
        translate: -50% -50%;
        transition:
          left 620ms ease,
          top 620ms ease,
          width 420ms ease,
          height 420ms ease,
          box-shadow 180ms ease,
          transform 420ms ease;
      }
      .government-node,
      .ministry-node {
        position: absolute;
        z-index: 2;
        display: grid;
        place-items: center;
        translate: -50% -50%;
        border-radius: 50%;
        text-align: center;
        pointer-events: none;
      }
      .government-node {
        width: 112px;
        height: 112px;
        border: 5px solid #ffffffb8;
        background: #173d68;
        box-shadow: 0 1rem 3rem #173d6840;
        color: white;
        font-size: 0.9rem;
        font-weight: 900;
      }
      .ministry-node {
        width: 76px;
        height: 76px;
        padding: 0.55rem;
        border: 4px solid #ffffffc9;
        background: var(--category-color, #52677c);
        box-shadow: 0 0.6rem 1.8rem #18223026;
        color: white;
        font-size: 0.62rem;
        font-weight: 850;
        line-height: 1.1;
      }
      .map-node.policy {
        border-color: color-mix(in srgb, var(--node-color, #777f87) 58%, white);
        background: radial-gradient(
          circle at 32% 28%,
          white,
          color-mix(in srgb, var(--node-color, #777f87) 12%, white) 68%
        );
        box-shadow:
          0 0 0 5px var(--node-halo, rgb(91 99 107 / 11%)),
          0 0.45rem 1.4rem rgb(24 40 58 / 12%);
      }
      .map-node.indicator {
        border-color: #397ab5;
        background: #eaf4fc;
      }
      .map-node.situation-negative {
        border: 2px solid #b64b4b;
        background: #fdeeee;
      }
      .map-node.situation-positive {
        border: 2px solid #2d8a5c;
        background: #eaf8f0;
      }
      .map-node.inactive {
        border-style: dashed;
        filter: grayscale(0.55);
        opacity: 0.62;
      }
      .map-node:hover,
      .map-node:focus-visible,
      .map-node.selected {
        z-index: 3;
        box-shadow:
          0 0 0 7px rgb(32 105 170 / 14%),
          0 0.8rem 2rem rgb(24 40 58 / 20%);
        outline: none;
      }
      .map-node.relation-focus {
        z-index: 3;
      }
      .node-name {
        max-width: 9rem;
        font-size: 0.72rem;
        font-weight: 780;
        line-height: 1.18;
      }
      .node-type {
        margin-bottom: 0.22rem;
        color: #5f6a75;
        font-size: 0.55rem;
        font-weight: 900;
        letter-spacing: 0.07em;
      }
      .node-value {
        margin-top: 0.25rem;
        font-size: 1rem;
        font-variant-numeric: tabular-nums;
        font-weight: 850;
      }
      .node-delta {
        position: absolute;
        top: -0.3rem;
        right: -0.3rem;
        padding: 0.2rem 0.38rem;
        border-radius: 999px;
        background: #22704b;
        color: #fff;
        font-size: 0.68rem;
        font-weight: 850;
      }
      .node-delta.negative {
        background: #af4141;
      }
      .prepared {
        position: absolute;
        bottom: -1.45rem;
        padding: 0.18rem 0.42rem;
        border-radius: 999px;
        background: #8b570f;
        color: white;
        font-size: 0.65rem;
        font-weight: 800;
        white-space: nowrap;
      }
      .law-editor {
        width: min(92vw, 660px);
        max-height: 86vh;
        padding: 1.4rem;
        border: 0;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 1.5rem 5rem rgb(15 32 48 / 28%);
        overflow: auto;
      }
      .law-editor::backdrop {
        background: rgb(13 27 42 / 38%);
        backdrop-filter: blur(2px);
      }
      .dialog-close {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        width: 2.2rem;
        min-height: 2.2rem;
        padding: 0;
        border-radius: 50%;
        background: #edf1f4;
        color: #344455;
        font-size: 1.4rem;
      }
      .dialog-copy {
        padding-right: 2.2rem;
      }
      .dialog-eyebrow {
        color: #657483;
        font-size: 0.64rem;
        font-weight: 900;
        letter-spacing: 0.08em;
      }
      .law-editor h2 {
        margin: 0 0 0.25rem;
        font-size: 1rem;
      }
      .law-editor p {
        margin: 0.35rem 0 0;
        color: #65717e;
        font-size: 0.78rem;
        line-height: 1.4;
      }
      .law-editor label,
      .control-decision {
        display: grid;
        gap: 0.35rem;
        color: #596675;
        font-size: 0.72rem;
        font-weight: 750;
      }
      .law-editor input[type="range"] {
        width: 100%;
      }
      .source {
        color: #466987;
        font-size: 0.7rem;
      }
      .effects {
        display: grid;
        gap: 0.55rem;
        margin-top: 1.1rem;
      }
      .effects h3 {
        margin: 0 0 0.1rem;
        font-size: 0.82rem;
      }
      .effect {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.65rem 0.75rem;
        border-left: 3px solid #8c99a5;
        border-radius: 0.45rem;
        background: #f6f8fa;
        font-size: 0.72rem;
      }
      .effect.positive {
        border-color: #25865a;
      }
      .effect.negative {
        border-color: #be4f4f;
      }
      .effect span {
        color: #687583;
        text-align: right;
      }
      .policy-controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 1rem;
        align-items: end;
        margin-top: 1.2rem;
        padding-top: 1rem;
        border-top: 1px solid #e7ebef;
      }
      .scope-choices {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }
      .scope-choices button {
        min-height: 2rem;
        padding: 0.35rem 0.5rem;
        border: 1px solid #c7d0d9;
        background: #fff;
        color: #344455;
        font-size: 0.68rem;
      }
      .scope-choices button.selected {
        border-color: #376e9f;
        background: #e9f3fb;
        color: #1e5f91;
      }
      .status {
        display: inline-block;
        padding: 0.28rem 0.5rem;
        border-radius: 999px;
        background: #edf1f4;
        font-weight: 850;
      }
      .status.active {
        background: #e4f5eb;
        color: #217049;
      }
      .notice {
        position: absolute;
        z-index: 5;
        right: 1rem;
        bottom: 1rem;
        max-width: 22rem;
        padding: 0.7rem 0.85rem;
        border-radius: 0.55rem;
        background: #16283b;
        color: white;
        font-size: 0.76rem;
      }
      .institution-bar {
        position: relative;
        z-index: 12;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.25rem;
        height: var(--institution-bar-height);
        padding: 0.7rem 1.5rem 0.7rem 5rem;
        border-bottom: 1px solid #dce5ec;
        background:
          radial-gradient(ellipse at 12% 0%, #3b886f22, transparent 48%),
          linear-gradient(105deg, #102c3b, #173d4b 54%, #1e4951);
        box-shadow: 0 5px 20px #142c3b24;
        color: #f4f8f7;
      }
      .country-mark,
      .mandate-mark,
      .quarter-mark {
        display: grid;
        gap: 0.18rem;
      }
      .country-mark {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        font-size: 1.05rem;
        font-weight: 850;
        letter-spacing: 0.02em;
      }
      .country-seal {
        display: grid;
        width: 2.35rem;
        height: 2.35rem;
        place-items: center;
        border: 1px solid #a7d4c4a8;
        border-radius: 50%;
        background: #ffffff13;
        color: #c1ebd9;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
      }
      .mandate-mark {
        margin-left: auto;
        padding-left: 1.2rem;
        border-left: 1px solid #ffffff2b;
      }
      .institution-eyebrow {
        color: #b5d4cc;
        font-size: 0.58rem;
        font-weight: 850;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .mandate-mark strong {
        font-size: 0.8rem;
        font-weight: 700;
      }
      .quarter-mark {
        min-width: 6.8rem;
        padding: 0.48rem 0.75rem;
        border: 1px solid #ffffff30;
        border-radius: 0.7rem;
        background: #ffffff12;
      }
      .quarter-mark strong {
        font-size: 0.86rem;
        font-variant-numeric: tabular-nums;
      }
      #indicator-card {
        position: fixed;
        z-index: 8;
        top: calc(var(--institution-bar-height) + 5.25rem);
        right: 1.25rem;
        display: grid;
        gap: 0.7rem;
        width: min(19rem, calc(100vw - 2rem));
        padding: 1rem;
        border: 1px solid #d3e0e5;
        border-radius: 1rem;
        background: linear-gradient(155deg, #fffffffa, #f1f7f5f5);
        box-shadow: 0 1rem 2.8rem #183a4924;
        color: #243948;
        pointer-events: none;
      }
      .indicator-card__eyebrow {
        color: #39745f;
        font-size: 0.6rem;
        font-weight: 900;
        letter-spacing: 0.12em;
      }
      .indicator-card__title {
        margin: 0.12rem 0 0;
        font-size: 1rem;
        line-height: 1.25;
      }
      .indicator-card__value {
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
        color: #173d4b;
        font-size: 1.45rem;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }
      .indicator-card__value small {
        color: #71828c;
        font-size: 0.65rem;
        font-weight: 700;
      }
      .indicator-card__description {
        margin: 0;
        color: #5d6e78;
        font-size: 0.72rem;
        line-height: 1.5;
      }
      .indicator-card__relevance {
        display: grid;
        gap: 0.25rem;
        padding-top: 0.65rem;
        border-top: 1px solid #dce6e7;
      }
      .indicator-card__relevance strong {
        color: #385c58;
        font-size: 0.66rem;
      }
      .indicator-card__relevance span {
        color: #64777a;
        font-size: 0.65rem;
        line-height: 1.4;
      }
      .indicator-card__hint {
        margin: 0;
        color: #839197;
        font-size: 0.58rem;
      }
      @media (max-width: 760px) {
        .map-toolbar {
          align-items: flex-start;
          flex-direction: column;
        }
        .institution-bar {
          gap: 0.7rem;
          padding-right: 0.8rem;
          padding-left: 4.2rem;
        }
        .mandate-mark {
          padding-left: 0.7rem;
        }
        .mandate-mark strong {
          max-width: 8rem;
          font-size: 0.68rem;
        }
        .country-mark {
          gap: 0.4rem;
          font-size: 0.88rem;
        }
        .country-seal {
          width: 2rem;
          height: 2rem;
        }
        .quarter-mark {
          min-width: 5.6rem;
          padding: 0.4rem 0.55rem;
        }
        .law-stage {
          min-height: 820px;
        }
        .policy-controls {
          grid-template-columns: 1fr;
        }
        .link-button {
          display: none;
        }
        #indicator-card {
          top: auto;
          right: 0.75rem;
          bottom: 5.2rem;
          width: min(16rem, calc(100vw - 1.5rem));
          padding: 0.75rem;
        }
      }
      #map-viewport {
        position: relative;
        height: calc(100dvh - var(--institution-bar-height));
        overflow: hidden;
        touch-action: none;
        cursor: grab;
      }
      #map-viewport.dragging {
        cursor: grabbing;
      }
      #map-viewport .law-stage {
        width: 1600px;
        height: 1600px;
        min-height: 0;
        min-width: 0;
        overflow: visible;
        transform-origin: 0 0;
      }
      .navigation-tools {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.5rem 1.5rem;
        flex-wrap: wrap;
      }
      .navigation-tools span {
        font-size: 0.75rem;
        color: #687583;
      }
      .navigation-tools output {
        min-width: 3rem;
        text-align: center;
      }
      .category-zone {
        width: 39%;
      }
      body {
        overflow: hidden;
      }
      .game-menu {
        position: fixed;
        top: calc(var(--institution-bar-height) + 12px);
        left: 18px;
        z-index: 10;
      }
      .game-menu summary {
        list-style: none;
        cursor: pointer;
        padding: 0.65rem 0.85rem;
        background: white;
        border: 1px solid #e7ebef;
        border-radius: 50%;
        box-shadow: 0 4px 18px #18223010;
      }
      .game-menu nav {
        display: grid;
        gap: 1rem;
        width: 240px;
        padding: 1rem;
        margin-top: 0.5rem;
        background: white;
        border-radius: 1rem;
        box-shadow: 0 8px 30px #18223020;
      }
      .game-menu p {
        color: #687583;
        font-size: 0.75rem;
        margin: 0;
      }
      .game-turn {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 10;
        display: flex;
        gap: 0.75rem;
        align-items: center;
        padding: 0.55rem;
        background: #fffffff0;
        border-radius: 999px;
        box-shadow: 0 6px 28px #18223018;
      }
      .game-turn button {
        border-radius: 999px;
      }
      .map-zoom-controls {
        position: fixed;
        top: calc(var(--institution-bar-height) + 12px);
        right: 18px;
        z-index: 10;
        display: grid;
        gap: 0.35rem;
      }
      .map-zoom-controls button {
        width: 2.5rem;
        min-height: 2.5rem;
        padding: 0;
        border-radius: 50%;
        background: #fffffff0;
        color: #344455;
        box-shadow: 0 4px 18px #18223010;
        font-size: 1.4rem;
        line-height: 1;
      }
      #pending:empty {
        display: none;
      }
      .policy-icon {
        width: 30px;
        height: 30px;
        pointer-events: none;
      }
      .policy-tooltip {
        position: absolute;
        bottom: calc(100% + 10px);
        left: 50%;
        transform: translateX(-50%);
        width: max-content;
        max-width: 220px;
        padding: 8px 12px;
        border-radius: 10px;
        background: #182230;
        color: white;
        font-size: 12px;
        line-height: 1.4;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
      }
      .map-node.policy:hover .policy-tooltip,
      .map-node.policy:focus-visible .policy-tooltip {
        opacity: 1;
        visibility: visible;
      }
      .map-node.policy:focus-visible {
        outline: 2px solid #376e9f;
        outline-offset: 5px;
      }
      .map-node.policy .node-value {
        font-size: 0.66rem;
        white-space: nowrap;
      }
      .policy-abbreviation {
        max-width: 4.8rem;
        overflow: hidden;
        color: #33485b;
        font-size: 0.53rem;
        font-weight: 850;
        line-height: 1.05;
        text-align: center;
        text-overflow: clip;
      }
      .map-node.policy {
        animation: quiet-orbit 8s ease-in-out infinite alternate;
        animation-delay: calc(var(--orbit-index, 0) * -0.17s);
      }
      @keyframes quiet-orbit {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(2px, -1.5px);
        }

        <button id="zoom-in" type="button" aria-label="Aumentar zoom">+</button>
      </div>
      <main>
        <div
          id="map-viewport"
          tabindex="0"
          aria-label="Mapa navegável. Use as setas para mover e mais ou menos para zoom."
        >
          <section
            id="law-stage"
            class="law-stage"
            aria-label="Mapa de políticas públicas, indicadores e situações"
          ></section>
        </div>
        <dialog id="law-editor" class="law-editor"></dialog>
      </main>
    </div>
    <dialog id="menu-dialog" class="menu-dialog">
      <button
        id="menu-dialog-close"
        class="menu-dialog__close"
        type="button"
        aria-label="Fechar"
      >
        ×
      </button>
      <div id="menu-dialog-content"></div>
    </dialog>
    <script type="module" src="/src/lawMapDemo.ts"></script>
  </body>
</html>
