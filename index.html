<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101d30" />
    <title>SisGov — Mapa político</title>
    <style>
      :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#203047;background:#f7f8f6;font-synthesis:none;text-rendering:optimizeLegibility;--navy:#101d30;--muted:#77869a;--green:#176e55;--line:#dfe5e5}
      *{box-sizing:border-box}body{margin:0;min-width:360px;min-height:100vh;overflow:hidden}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #62aee4;outline-offset:2px}
      .app-header{height:72px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 11px;gap:0;position:relative;z-index:4;box-shadow:0 4px 14px #07132230}.brand{height:100%;min-width:236px;display:flex;align-items:center;gap:10px;padding-right:17px;border-right:1px solid #ffffff24}.seal{width:40px;height:40px;border-radius:50%;background:#197a54;border:1px solid #e1c44d;display:grid;place-items:center;color:#ffdf60;font-size:10px;font-weight:900;letter-spacing:.04em}.brand-name{font-size:19px;font-weight:850;letter-spacing:.02em}.brand-sub{display:block;margin-top:3px;color:#c2cbd6;font-size:10px}.metrics{height:100%;display:flex;align-items:stretch;flex:1;min-width:0}.metric{display:flex;flex-direction:column;justify-content:center;min-width:125px;padding:0 15px;border-right:1px solid #ffffff1b}.metric-label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#acbac8;white-space:nowrap}.metric-value{font-size:15px;margin-top:5px;font-weight:780;white-space:nowrap}.metric-value.unavailable{color:#d1d7df;font-weight:500}.turn-mark{min-width:93px;margin-left:auto;text-align:center;padding:0 10px;color:#c2cbd6}.turn-mark small{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.08em}.turn-mark strong{display:block;margin-top:4px;color:#fff;font-size:14px}
      .shell{height:calc(100vh - 72px);min-height:480px;display:grid;grid-template-columns:64px minmax(0,1fr)}.side-nav{position:relative;z-index:3;background:#14233a;color:#d5deea;display:flex;flex-direction:column;gap:3px;padding:9px 4px}.nav-item{border:0;background:transparent;color:inherit;border-radius:7px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 1px;text-align:center;font-size:8px;line-height:1.1;font-weight:650}.nav-item:hover,.nav-item.active{background:#ffffff15;color:#fff}.nav-icon{color:#a9c6bc;font-size:18px;line-height:1}.workspace{position:relative;min-width:0;min-height:0;overflow:hidden;background:#f7f8f6}#map-viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;background-color:#f7f8f6;background-image:radial-gradient(#d8dfdf 0.75px,transparent .75px);background-size:22px 22px}#map-canvas{display:block;width:100%;height:100%;user-select:none}#map-content{transform-origin:0 0}
      .area-influence{stroke-width:2;fill-opacity:.075;stroke-opacity:.55}.area-name{font-size:18px;font-weight:760;text-anchor:middle;fill:#304058}.area-count{font-size:13px;text-anchor:middle;fill:#65758a}.minister-avatar{fill:#fff;stroke:var(--tone);stroke-width:3}.avatar-head{fill:var(--tone)}.avatar-body{fill:var(--tone)}.ministry-area{cursor:pointer}.ministry-area:hover .area-influence,.ministry-area.expanded .area-influence{fill-opacity:.14;stroke-opacity:.9;stroke-width:3}.ministry-area.dim{opacity:.22}.ministry-area.related{opacity:1}.law-node circle{fill:#fff;stroke:var(--tone);stroke-width:2.2}.law-node:hover circle,.law-node.selected circle{fill:var(--tone);stroke:#fff;stroke-width:3.5;filter:drop-shadow(0 3px 7px #17273d3d)}.law-node:hover .node-icon,.law-node.selected .node-icon,.law-node:hover .node-label,.law-node.selected .node-label{fill:#fff}.node-icon{font-size:15px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:var(--tone);pointer-events:none}.node-label{font-size:10px;font-weight:700;text-anchor:middle;fill:#34445a;pointer-events:none}.law-node .node-label{font-size:9px}.multi-mark{fill:#fff;stroke:var(--tone);stroke-width:1.5}.indicator-node circle{fill:#fff;stroke:#98a8ae;stroke-width:1.7}.indicator-node[data-kind="estoque"] circle{stroke:#4c8da2}.indicator-node[data-kind="situacao"] circle{stroke:#d39a3c}.indicator-node[data-kind="evento"] circle{stroke:#c95f65}.indicator-node .node-icon{fill:#536c78}.indicator-node .node-label{font-size:9px;opacity:0;transition:opacity .14s}.indicator-node:hover .node-label,.indicator-node.selected .node-label{opacity:1}.indicator-node.dim,.law-node.dim{opacity:.12}.indicator-node.related,.law-node.related{opacity:1}.constitution-ring{fill:#fff8e7;fill-opacity:.28;stroke:#c69b42;stroke-width:2;stroke-dasharray:6 7}.president-core circle{fill:#176e55;stroke:#fff;stroke-width:8;filter:drop-shadow(0 6px 12px #0e443749)}.president-core .person-head,.president-core .person-body{fill:#d5eee3}.president-core .president-label{fill:#fff;font-size:17px;font-weight:800;text-anchor:middle}.president-core .president-sub{fill:#c3e2d3;font-size:10px;text-anchor:middle;letter-spacing:.08em}.institution-node circle{fill:#fffaf0;stroke:#c39a47;stroke-width:2}.institution-node .node-icon{fill:#9a762a}.map-edge{fill:none;stroke:#87969c;stroke-opacity:.028;stroke-width:1.35;pointer-events:none}.map-edge[data-signal="-1"]{stroke:#bf7770}.map-edge.focus{stroke:#23826c;stroke-opacity:.88;stroke-width:2.6}.map-edge.dim{stroke-opacity:.018}.map-edge.focus-negative{stroke:#c45d61;stroke-opacity:.88;stroke-width:2.6}
      .map-topline{position:absolute;z-index:2;top:13px;left:16px;pointer-events:none}.map-topline small{display:block;color:#758398;font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:750}.map-topline strong{display:block;margin-top:4px;color:#314056;font-size:16px}.map-tools{position:absolute;z-index:3;right:14px;bottom:14px;display:flex;align-items:flex-end;gap:9px}.zoom-stack{display:grid;gap:4px}.zoom-stack button,.turn-button{height:38px;min-width:38px;border:1px solid #dae1e5;border-radius:8px;background:#fff;color:#283b50;box-shadow:0 3px 12px #15263a18;font-size:17px;font-weight:750}.zoom-stack button:hover{background:#f0f5f2}.turn-button{height:43px;padding:0 16px;border:0;background:#14243a;color:#fff;font-size:11px}.turn-button:hover{background:#263d59}.turn-button:disabled{opacity:.6;cursor:wait}
      .side-panel{position:absolute;z-index:4;right:14px;top:62px;width:300px;max-height:calc(100% - 132px);overflow:auto;pointer-events:none}.side-panel>*{pointer-events:auto}.card{background:#ffffffed;border:1px solid #dce4e5;border-radius:12px;padding:15px;box-shadow:0 8px 28px #15283b24;backdrop-filter:blur(8px)}.card-eyebrow{color:#7b8b9b;font-size:9px;text-transform:uppercase;letter-spacing:.11em;font-weight:800}.card h2{margin:6px 0 7px;font-size:17px;line-height:1.25;color:#25364c}.card p{margin:0;color:#647489;font-size:11px;line-height:1.5}.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.tag{border-radius:99px;background:#edf2f2;color:#5f7183;padding:4px 7px;font-size:9px;font-weight:700}.detail-value{margin:11px 0 2px;font-size:19px;font-weight:800;color:#203149}.detail-value small{font-size:10px;color:#738398;font-weight:600}.control-label{display:flex;justify-content:space-between;gap:8px;margin:14px 0 7px;font-size:10px;font-weight:750;color:#526278}.control-output{color:#1d7c5f}.range-input{width:100%;accent-color:#238568}.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.option-choice{border:1px solid #dbe4e6;background:#fff;border-radius:7px;color:#42556d;padding:7px;text-align:left;font-size:9px;font-weight:700}.option-choice.active{background:#e7f3ed;border-color:#62a98b;color:#1f6f53}.apply-change{border:0;border-radius:7px;background:#248366;color:#fff;padding:9px 12px;font-size:10px;font-weight:750;width:100%;margin-top:11px}.effect-list{display:grid;gap:6px;margin:10px 0 0;padding:0;list-style:none}.effect-list li{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #edf0f1;padding-top:6px;color:#485b70;font-size:9px}.effect-direction{font-weight:800;color:#238266}.effect-direction.down{color:#bc6062}.effect-timing{color:#7d8a99;text-align:right;white-space:nowrap}.turn-log-button{position:absolute;z-index:3;left:12px;bottom:13px;border:1px solid #d6dfe3;border-radius:8px;background:#14243a;color:#fff;padding:10px 12px;font-size:10px;font-weight:750;box-shadow:0 4px 16px #15263a20}.report-card{margin-top:8px}.report-list{padding:0;margin:9px 0 0;list-style:none;display:grid;gap:6px}.report-list li{display:flex;justify-content:space-between;gap:8px;color:#62748a;font-size:9px}.report-list strong{color:#28394e;white-space:nowrap}.log-card{margin-top:8px}.log-item{border-top:1px solid #edf0f1;padding-top:7px;margin-top:7px;color:#65758a;font-size:9px;line-height:1.4}.log-item strong{display:block;color:#2f4056;margin-bottom:2px}.notice{position:absolute;z-index:8;left:50%;top:15px;transform:translateX(-50%);max-width:min(600px,90%);border-radius:8px;background:#17283e;color:#fff;padding:10px 14px;box-shadow:0 6px 24px #17283e36;font-size:11px}
      dialog{width:min(480px,calc(100vw - 24px));border:0;border-radius:14px;padding:20px;color:#24364b;box-shadow:0 18px 70px #101e3150}dialog::backdrop{background:#101d30a8;backdrop-filter:blur(2px)}dialog h2{font-size:19px;margin:0 35px 8px 0}dialog p{font-size:11px;color:#69798b;line-height:1.5}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.dialog-actions button{border:0;border-radius:7px;padding:9px 13px;font-size:10px;font-weight:750}.cancel{background:#eef2f3;color:#607186}.save{background:#238366;color:#fff}
      @media(max-width:950px){.brand{min-width:170px}.metric{min-width:94px;padding:0 9px}.metric-label{font-size:8px}.metric-value{font-size:12px}.side-nav{padding-left:3px;padding-right:3px}}
      @media(max-width:700px){.app-header{height:auto;min-height:72px;flex-wrap:wrap;padding:8px}.brand{height:46px;min-width:0;border:0;padding:0 9px 0 0}.brand-name{font-size:16px}.seal{width:34px;height:34px}.metrics{order:3;flex-basis:100%;height:43px;overflow-x:auto}.metric{min-width:100px;padding:0 8px}.turn-mark{margin-left:auto}.shell{height:calc(100vh - 104px);grid-template-columns:48px minmax(0,1fr)}.nav-item{min-height:48px;font-size:7px}.nav-icon{font-size:16px}.side-panel{right:7px;top:53px;width:min(290px,calc(100vw - 66px));max-height:calc(100% - 110px)}.map-topline{left:9px;top:9px}.map-topline strong{font-size:13px}.map-tools{right:8px;bottom:8px;gap:5px}.turn-button{height:38px;padding:0 10px}.zoom-stack button{height:34px;min-width:34px}.turn-log-button{left:7px;bottom:8px;padding:8px;font-size:9px}}
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="brand"><span class="seal" aria-hidden="true">BR</span><div><span class="brand-name">SisGov</span><span class="brand-sub" id="country-name">Brasil</span></div></div>
      <div class="metrics" aria-label="Dados do país">
        <div class="metric"><span class="metric-label">Caixa</span><strong class="metric-value" id="cash-value">—</strong></div>
        <div class="metric"><span class="metric-label">Dívida</span><strong class="metric-value" id="debt-value">—</strong></div>
        <div class="metric"><span class="metric-label">PIB anual</span><strong class="metric-value" id="gdp-value">—</strong></div>
        <div class="metric"><span class="metric-label">Aprovação do partido</span><strong class="metric-value unavailable" id="party-approval" title="Dado ainda não disponível na API da partida">—</strong></div>
      </div>
      <div class="turn-mark"><small>Turno</small><strong id="turn-value">1</strong></div>
    </header>
    <div class="shell">
      <nav class="side-nav" aria-label="Navegação do jogo">
        <button class="nav-item active" type="button" data-filter="all" aria-current="page"><span class="nav-icon">⌂</span><span>Visão geral</span></button>
        <button class="nav-item" type="button" data-filter="ministries"><span class="nav-icon">♙</span><span>Ministérios</span></button>
        <button class="nav-item" type="button" data-filter="laws"><span class="nav-icon">§</span><span>Leis</span></button>
        <button class="nav-item" type="button" data-filter="budget"><span class="nav-icon">▤</span><span>Orçamento</span></button>
        <button class="nav-item" type="button" data-filter="indicators"><span class="nav-icon">⌁</span><span>Indicadores</span></button>
        <button class="nav-item" type="button" data-filter="events"><span class="nav-icon">✦</span><span>Eventos</span></button>
      </nav>
      <main class="workspace">
        <section id="map-viewport" aria-label="Mapa político navegável. Arraste para percorrer e use a roda do mouse para aproximar.">
          <div class="map-topline"><small>Brasil · rede de governança</small><strong>Mapa político</strong></div>
          <svg id="map-canvas" viewBox="0 0 1600 1100" role="img" aria-label="Presidência, ministérios, leis e indicadores conectados"><g id="map-content"></g></svg>
          <button id="toggle-log" class="turn-log-button" type="button" aria-expanded="false">☷ &nbsp; Registro de ações</button>
          <div class="map-tools" role="group" aria-label="Controles da partida">
            <div class="zoom-stack"><button id="zoom-in" type="button" aria-label="Aproximar">+</button><button id="zoom-out" type="button" aria-label="Afastar">−</button><button id="reset-view" type="button" aria-label="Voltar à visão geral">◎</button></div>
            <button id="advance-turn" class="turn-button" type="button">Encerrar turno ›</button>
          </div>
          <div id="notice" class="notice" role="status" hidden></div>
        </section>
        <aside class="side-panel" aria-label="Detalhes da seleção">
          <section id="selection-card" class="card" aria-live="polite" hidden></section>
          <section id="report-card" class="card report-card" hidden></section>
          <section id="turn-log-card" class="card log-card" hidden><span class="card-eyebrow">Registro de ações</span><div id="turn-log-content"></div></section>
        </aside>
      </main>
    </div>
    <dialog id="law-editor"><form method="dialog" id="law-form"></form></dialog>
    <script type="module" src="/src/lawMapDemo.ts"></script>
  </body>
</html>
