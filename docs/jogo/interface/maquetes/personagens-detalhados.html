<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personagens detalhados (maquete)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --papel: #f1e8d2;
        --preto: #1c1a1a;
        --vermelho: #d8362b;
        --azul: #1f4e8c;
        --amarelo: #f4b81c;
        --verde: #2f7d5b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--papel);
        color: var(--preto);
        font-family: "Oswald", Impact, sans-serif;
        padding: 24px 16px 40px;
        min-height: 100vh;
      }
      h1 {
        font-size: clamp(30px, 5vw, 48px);
        text-transform: uppercase;
        max-width: 1100px;
        margin: 0 auto 6px;
      }
      .sub {
        max-width: 1100px;
        margin: 0 auto 26px;
        font-size: 18px;
        font-weight: 500;
      }
      .grade {
        max-width: 1100px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 24px;
      }
      figure {
        background: var(--papel);
        border: 4px solid var(--preto);
        box-shadow: 7px 7px 0 var(--azul);
        padding: 12px 12px 14px;
      }
      figure:nth-child(even) {
        transform: rotate(1deg);
        box-shadow: 7px 7px 0 var(--vermelho);
      }
      figure:nth-child(odd) {
        transform: rotate(-1deg);
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
        border: 3px solid var(--preto);
      }
      figcaption {
        margin-top: 12px;
      }
      .nome {
        display: block;
        font-size: 26px;
        font-weight: 700;
      }
      .cargo {
        display: block;
        font-size: 16px;
        font-weight: 500;
        margin-top: 2px;
      }
      .frase {
        display: block;
        font-size: 15px;
        font-weight: 500;
        margin-top: 8px;
        border-top: 2px dashed var(--preto);
        padding-top: 8px;
      }
      @media (prefers-reduced-motion: reduce) {
        figure {
          transform: none !important;
        }
      }
    </style>
  </head>
